<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2230"/><stop offset="1" stop-color="#11141b"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d38a"/><stop offset="1" stop-color="#c9a15b"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3142"/><stop offset="1" stop-color="#1a1f2b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".62" r=".5"><stop offset="0" stop-color="#c9a15b" stop-opacity=".42"/><stop offset="1" stop-color="#c9a15b" stop-opacity="0"/></radialGradient>
</defs>
<rect width="40" height="40" rx="7" fill="url(#bg)"/>
