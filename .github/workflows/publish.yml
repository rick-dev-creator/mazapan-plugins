# What Mazapan and mazapan.dev read, made again whenever the list changes,
# and once a day for what GitHub says (each developer's profile, the stars):
# generated/index.toml (the catalog), plugins.json, media/ and authors/ (the gallery).
name: Publish

on:
  push:
    branches: [main]
    paths: [plugins.toml, tools/**]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-main
  cancel-in-progress: false

jobs:
  publish:
    name: Generated · catalog and gallery
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git before the checkout, or it comes without its history.
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python >/dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mazapan
        with:
          ref: ${{ vars.MAZAPAN_REF || 'main' }}
      - name: Build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git pull --quiet --rebase origin main
          python tools/registry.py build
      - name: Commit
        shell: bash
        run: |
          git add -A generated
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git -c user.name="mazapan-registry[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "generated: $(git log -1 --format=%s -- plugins.toml tools)"
          git push --quiet origin HEAD:main
